name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blackwall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # Same as the committed .env. SQLX_OFFLINE=true also comes from .env, so
      # builds use .sqlx/; `cargo sqlx prepare` turns it off for its own build.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/blackwall
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The version must match `sqlx` in Cargo.lock.
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.8.6 --locked --no-default-features --features rustls,postgres
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Migrate
        run: sqlx migrate run
      - name: Check .sqlx/ is current
        run: cargo sqlx prepare --check -- --all-targets
      - name: Test
        run: cargo test --locked

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: blackwall-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
