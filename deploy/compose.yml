# Production stack: the sync service only. PostgreSQL is provided externally.
# Run from the repo root: docker compose -f deploy/compose.yml up -d --build
# Configuration comes from deploy/.env (copy deploy/.env.example). See deploy/README.md.
name: blackwall-sync

services:
  service:
    build:
      context: ..
      dockerfile: Dockerfile
    image: blackwall-backend:latest
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in deploy/.env}
      RUST_LOG: info
    # Only the reverse proxy should reach this; keep the default loopback bind
    # unless the proxy runs on another host and the port is firewalled.
    ports:
      - "${SYNC_BIND_ADDR:-127.0.0.1}:${SYNC_PORT:-8080}:8080"
    restart: unless-stopped
